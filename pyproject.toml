[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rxnflow"
dynamic = ["version"]
description = "Synthesizable molecular design with GFlowNet"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seonghwan Seo", email = "shwan0106@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]
keywords = ["gflownet", "molecular-generation", "synthesis"]
dependencies = [
  "numpy>=2.0",
  "torch>=2.1",
  "omegaconf>=2.3",
  "rdkit>=2023.9.6",
]

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8", "ruff>=0.5", "wheel>=0.45"]

[project.scripts]
rxnflow-prepare = "rxnflow.cli.prepare:main"
rxnflow-sample = "rxnflow.cli.sample:main"

[tool.setuptools.dynamic]
version = { attr = "rxnflow.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = ["heavy: requires the local Enamine stock catalog and substantial compute"]
