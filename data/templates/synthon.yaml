# Each conversion marks one synthesis handle. Protected handles count as sites.
# Alternative representations of the same building block remain distinct.
- type: 1
  original: "[NX3;!H0;$(N[#6]);!$(N[#7]);!$(N[#0]);!$(N[C,S]=[N,O,S]):1]"
  convert: "[#7:1]-[1*]"
- type: 2
  original: "[#6:1]-[OH,nH,NH;!$(*[#0]):2]"
  convert: "[#6:1]-[*:2]-[2*]"
- type: 3
  original: "[#6:1]-C(=O)[OH,O-]"
  convert: "[#6:1]-[3*]"
- type: 4
  original: "[#6:1]-[CH]=O"
  convert: "[#6:1]-[4*]"
- type: 5
  original: "[#6:1]-C(=O)-[F,Cl,Br,$(O[CH3]),$(O[CH2][CH3]),$(O[CH2][C](F)(F)F)]"
  convert: "[#6:1]-[5*]"
- type: 6
  original: "[#6:1]-C(=O)[NH][NH2]"
  convert: "[#6:1]-[6*]"
- type: 7
  original: "[#6:1]-[C:2](=O)[#6:3]"
  convert: "[CH0:2](-[#6:1])(-[#6:3])=[7*]"
- type: 8
  original: "[#6:1]-[Cl,Br,I]"
  convert: "[#6:1]-[8*]"
- type: 9
  original: "[#6:1]-[NH][NH2]"
  convert: "[#6:1]-[9*]"
- type: 10
  original: "[#6:1]-N=[N+]=[N-]"
  convert: "[#6:1]-[10*]"
- type: 11
  original: "[#6:1]-C#N"
  convert: "[#6:1]-[11*]"
- type: 12
  original: "[#6:1]-C#[CH]"
  convert: "[#6:1]-[12*]"
- type: 13
  original: "[#6:1]-S(=O)(=O)[F,Cl,Br,I]"
  convert: "[#6:1]-[13*]"
- type: 14
  original: "[C;!$(C=[N,O,S]):1]-[NH2]"
  convert: "[#6:1]-[14*]"
- type: 15
  original: "[C;!$(C=[N,O,S]):1]-[OH]"
  convert: "[#6:1]-[15*]"
- type: 16
  original: "[C;!$(C=[N,O,S]):1]-[SH]"
  convert: "[#6:1]-[16*]"
- type: 17
  original: "[C;!$(C=[N,O,S]):1]-[Cl,Br,I]"
  convert: "[#6:1]-[17*]"
- type: 18
  original: "[C;!$(C=[N,O,S]):1]-[Cl,$(OS(=O)(=O)[#6;!R])]"
  convert: "[#6:1]-[18*]"
- type: 19
  original: "[CH1:1]-[Cl,Br,I]"
  convert: "[#6:1]-[19*]"
- type: 20
  original: "[C:1]1[O:3][C:2]1"
  convert: "[20*]-[#6:1]-[#6:2]-[OH:3]"
- type: 21
  original: "[c:1]-[Cl,Br,I]"
  convert: "[#6:1]-[21*]"
- type: 22
  original: "[c:1]-[OH]"
  convert: "[#6:1]-[22*]"
- type: 23
  original: "[c:1]-B(O)O"
  convert: "[#6:1]-[23*]"
- type: 24
  original: "[CH3,CH2&$(C([#6])[#6]):1]-[$(C=O),$(C#N),$(S=O),$([N+](=O)[O-]):2]"
  convert: "[*:2]-[#6:1]=[24*]"
- type: 25
  original: "[CH2:1]([$(C=O),$(C#N),$(S=O),$([N+](=O)[O-]):2])[$(C=O),$(C#N),$(S=O),$([N+](=O)[O-]):3]"
  convert: "[#6:1](-[*:2])(-[*:3])=[25*]"
- type: 26
  original: "[C:1]=[C;$(C[$(C=O),$(C#N),$(S=O),$([N+](=O)[O-])]):2]"
  convert: "[26*]-[C:1]-[C:2]"
- type: 27
  original: "[NX3;$([NH]([#6])[C]),$([NH2][C]):1][C:2]C(=O)O[C;!R]"
  convert: "[27*]-N1C(=O)[N:1][C:2]C(=O)1"
- type: 28
  original: "[NX3;!H0;!$(N[C,S]=[N,O,S]):1][c:2][c:3][C:4](=[O:5])[NX3;!H0:6]"
  convert: "[N:1]1[c:2][c:3][C:4](=[O:5])[N:6]C1=[28*]"
- type: 29
  original: "[NH2:3][C;!$(C=[N,O,S]):4][C:5][C:6](=[O:7])O"
  convert: "[29*]-N1[C:6](=[O:7])[C:5][C:4][NH:3]C(=O)1"
- type: 30
  original: "[NH2:1][c:2][c:3][NH2,NH,SH,OH:4]"
  convert: "[30*]-c1[nH0+0:1][c:2][c:3][*:4]1"
- type: 31
  original: "[NH2:1][c:2][c:3][C:4](=[O:5])OC"
  convert: "[31*]-C1=[N:1][c:2][c:3][C:4](=[O:5])N1"
- type: 32
  original: "[NH2:1][c:2][c:3][C:4](=[O:5])OC"
  convert: "[NH:1]1[c:2][c:3][C:4](=[O:5])N([32*])C1=O"
# Latent amine: the Boc group is abstracted; nitrogen remains in the scaffold.
- type: 33
  original: "[N;X3;+0;!$(N[!#6]);!$(N(C=[O,N,S])C=[O,N,S]):1]-C(=O)-O-C([CH3])([CH3])[CH3]"
  convert: "[N:1]-[33*]"
# Latent carboxylic acid: type 34/35 retains which hydrolysis is needed.
- type: 34
  original: "[#6:1]-C(=O)-[O;X2;+0]-[CH3;D1]"
  convert: "[#6:1]-[34*]"
- type: 35
  original: "[#6:1]-C(=O)-[O;X2;+0]-[CH2;D2]-[CH3;D1]"
  convert: "[#6:1]-[35*]"
