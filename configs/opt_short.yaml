# Training configuration for low-budget optimization tasks (e.g., 10-20k budget)

training:
  # lower online batch size for more frequent updates
  num_online: 32
  num_replay: 96
  # lower ema decay for faster adaptation to new online data
  ema_decay: 0.95
  # lower random probability for more exploitation
  random_action_prob: 0.02
  # replay buffer including high-reward samples
  replay_capacity: 6400
  num_replay_insert: null # null(entire) | int
  replay_insert_priority: reward # uniform | reward
  replay_sample_priority: reward # uniform | reward
