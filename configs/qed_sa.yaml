# QED/SA product reward with reward-exponent conditioning.
data:
  env_dir: /path/to/prepared/enamine
  max_atoms: 50

run:
  output_dir: runs/qed_sa
  device: cuda
  seed: 0

reward:
  beta: "uniform(1,64)"
  moo_preferences: "none"
  moo_scalarization: mul
  settings: {}

property_penalty:
  mw: 500

training:
  steps: 3000
