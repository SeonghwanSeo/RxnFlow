# QED/SA product reward with reward-exponent conditioning.
data:
  env_dir: /path/to/prepared/env/

run:
  output_dir: runs/qed_sa
  device: auto
  seed: 0

reward:
  beta: "uniform(1,64)"
  moo_scalarization: mul
  moo_preferences: "none"
  settings: {}

property_penalty:
  mw: 500

training:
  steps: 3000
