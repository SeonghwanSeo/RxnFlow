# Complete RxnFlow configuration template. See configs/README.md for settings.
env_dir: /path/to/prepared/environment

reward:
  beta: "32" # scalar | uniform(lower,upper)
  moo_scalarization: mul # mul | sum
  moo_preferences: "none" # none | uniform | dirichlet(alpha)
  settings: {}

property_penalty: {}

subsampling:
  sampling_ratio: 0.1
  min_sampling: 50
  importance_temp: 1.0

generation:
  max_atoms: 50
  min_synthons: 2
  max_synthons: 3
  min_reactions: 1
  max_reactions: 3

model:
  hidden_dim: 256
  state_dim: 256
  num_state_layers: 4
  synthon_dim: 256
  num_action_layers: 3
  num_synthon_layers: 3
  dropout: 0.0

training:
  log_every: 10
  checkpoint_every: 1000
  num_online: 64
  num_replay: 64
  ema_decay: 0.99
  replay_capacity: 100000
  num_replay_insert: null
  replay_insert_priority: uniform # uniform | reward
  learning_rate: 0.0001
  learning_rate_logZ: 0.01
  lr_decay_steps: 10000
  weight_decay: 1e-8
  reward_floor: 0.00001
  random_action_prob: 0.1
  backward_synthon_penalty: 100.0
  retrosynthesis_workers: 4
