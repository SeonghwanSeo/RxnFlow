# Complete RxnFlow configuration template.

data:
  env_dir: /path/to/prepared/enamine
  max_atoms: 50

run:
  output_dir: runs/qed
  device: auto
  seed: 0

reward:
  # Fixed beta, or [low, high] for uniform sampling per fresh trajectory.
  exponent: 32.0
  # null: Dirichlet(1); otherwise fixed weights in reward.objectives order.
  preferences: null
  floor: 0.0001
  settings: {}

# Optional hard molecular-property upper bounds.
property_penalty: {}

# Uniform sampling within each compatible synthon block library.
subsampling:
  sampling_ratio: 0.05
  min_sampling: 50
  importance_temp: 1.0

# FirstBlock is excluded. The final allowed reaction must consume the last site.
generation:
  min_reactions: 1
  max_reactions: 3

model:
  hidden_dim: 128
  num_layers: 4
  block_dim: 128
  mlp_layers: 2  # Total Linear layers, including output.
  block_mlp_layers: 2
  dropout: 0.0

training:
  steps: 1000
  batch_size: 64
  replay_batch_size: 64
  replay_capacity: 10000
  learning_rate: 0.0001
  log_z_learning_rate: 0.1
  lr_decay_steps: 20000
  weight_decay: 0.00000001
  sampling_temperature: 1.0
  random_action_prob: 0.05
  ema_decay: 0.99
  checkpoint_every: 100
  log_every: 10
  retrosynthesis_workers: 4
