# Complete RxnFlow configuration template. See configs/README.md for settings.
env_dir: /path/to/prepared/environment
pretrained_model: null

# GFlowNet configuration
gflownet:
  beta: 64 # scalar | uniform(lower,upper) | log_uniform(lower,upper)
  moo_scalarization: sum
  moo_preference: "none" # none | fixed(...) | dirichlet | dirichlet(...)
  property_penalty_ratio: 0.2

# Chemical prior guidance
prior_guidance:
  model_name_or_path: null # null disables guidance
  strength: 0.5
  batch_size: 32

# External conditioning configuration
conditioning: {}

# Sampling configuration
generation:
  max_atoms: 50
  min_synthons: 2
  max_synthons: 3
  min_reactions: 1
  max_reactions: 3

# Property penalty configuration
property_penalty: {}

# RxnFlow action subsampling configuration
subsampling:
  sampling_ratio: 0.1
  min_sampling: 50
  importance_temp: 1.0

# RxnFlow model configuration
model:
  hidden_dim: 256
  state_dim: 256
  num_state_layers: 4
  synthon_dim: 256
  num_action_layers: 3
  num_synthon_layers: 2

# Exploration configuration
exploration:
  source: uniform # uniform | prior
  prior_ratio: 1.0 # fraction of exploration steps using prior vs uniform (when source=prior)
  strength: 0.25 # null reuses prior_guidance.strength
  temperature: 1.0

# RxnFlow training configuration
training:
  log_every: 10
  checkpoint_every: 1000
  # training batch size
  num_online: 64
  num_replay: 64
  # ema for sampler.
  ema_decay: 0.98
  # random action probability for exploration
  random_action_prob: 0.05
  # replay
  replay_capacity: 64000
  num_replay_insert: null # null(entire) | int
  replay_insert_priority: reward # uniform | reward
  replay_sample_priority: reward # uniform | reward
  # model training
  learning_rate: 0.0001
  learning_rate_logZ: 0.01
  lr_decay_steps: 5000
  weight_decay: 1e-8
  grad_clip: 100.0
  reward_floor: 1e-5
  loss_fn: huber # mse | mae | huber
  backward_synthon_penalty: 100.0
