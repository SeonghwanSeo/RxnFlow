# Minimal QED training configuration.
data:
  env_dir: /path/to/prepared/enamine
  max_atoms: 50

run:
  output_dir: runs/qed
  device: auto
  seed: 0

reward:
  beta: "32"
  settings: {}

property_penalty:
  mw: 500

subsampling:
  sampling_ratio: 0.05

generation:
  max_reactions: 3

training:
  steps: 1000
  batch_size: 64
  replay_batch_size: 64
