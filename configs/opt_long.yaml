# Training configuration for large-budget optimization tasks (e.g., >100k budget)

training:
  # training batch size
  num_online: 64
  num_replay: 64
  # larger ema decay for more stable training
  ema_decay: 0.98
  # higher random probability for more exploration
  random_action_prob: 0.05
  # replay
  replay_capacity: 64000
  num_replay_insert: null # null(entire) | int
  replay_insert_priority: uniform # uniform | reward
  replay_sample_priority: reward # uniform | reward
